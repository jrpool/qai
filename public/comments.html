<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="publisher" content="Jonathan Robert Pool">
    <meta name="creator" content="Jonathan Robert Pool">
    <meta name="keywords" content="large language models,tools,model context protocol">
    <meta name="description" content="QAI comments: submit bugs and recommended improvements">
    <title>Comments | QAI</title>
    <link rel="icon" href="favicon.ico" sizes="any">
  </head>
  <body>
    <main>
      <h1>QAI comment</h1>
      <p>Your comments on QAI are welcome! Please comment by submitting an issue on the <a href="https://github.com/jrpool/qai/issues">QAI GitHub repository</a>.</p>
      <p>In the future you will be able to comment by submitting this form.</p>
      <form action="/comment" method="post">
        <p id="commentLabel">Comment</p>
        <textarea
          name="comment"
          aria-labelledby="commentLabel"
          cols="50"
          required="true"
          rows="10"
        ></textarea>
        <p><button type="submit" disabled="true">Submit</button></p>
      </form>
    </main>
  </body>
</html>
